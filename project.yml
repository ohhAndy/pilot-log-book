name: PilotLogbook
options:
  bundleIdPrefix: com.personal
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: NO

targets:
  PilotLogbook:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Shared
      - path: iOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.pilotlogbook
        INFOPLIST_FILE: iOS/Info.plist
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PilotLogbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PilotLogbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.pilotlogbookTests
